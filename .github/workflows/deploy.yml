name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/funny-meitner-d1smqo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Only the repository's default branch may deploy to the github-pages environment.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      # Public client values (the anon key is public by design and ships in the browser bundle).
      NEXT_PUBLIC_SUPABASE_URL: https://gkuxdwckkrayhjglvdxp.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrdXhkd2Nra3JheWhqZ2x2ZHhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxMjE5MjQsImV4cCI6MjExMDY5NzkyNH0.DiHs7NMEVS8yBT6ctFxmL11hBVlW4_2Ik7mQFCRioMY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
